name: Build Unsigned IPA (iOS 12)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install dependencies (cargokit)
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Install dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Build iOS IPA (unsigned)
        working-directory: app
        run: |
          flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        working-directory: app
        run: |
          mkdir -p build/ios/ipa_output/Payload
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -R build/ios/iphoneos/Runner.app build/ios/ipa_output/Payload/
          elif [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa_output/Payload/
          fi
          cd build/ios/ipa_output
          zip -r LocalSend-v1.17.0-ios12-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-v1.17.0-ios12-unsigned-ipa
          path: app/build/ios/ipa_output/LocalSend-v1.17.0-ios12-unsigned.ipa
